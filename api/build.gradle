apply plugin: 'java-library'
apply plugin: "com.vanniktech.maven.publish"

dependencies {
    api libs.jacksonAnnotations
    api libs.jacksonDatabind
    api libs.jtokkit
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    testImplementation libs.jacksonDatabind
    testImplementation(platform(libs.junitBom))
    testImplementation('org.junit.jupiter:junit-jupiter')

//dependency added by roostGPT
testImplementation("com.knuddels:jtokkit:0.4.0")
testImplementation("org.projectlombok:lombok:1.18.30")
testImplementation("org.jetbrains:annotations:24.0.1")

//dependency added by roostGPT
testImplementation("org.mockito:mockito-core:5.2.0")
testImplementation("org.hamcrest:hamcrest:2.2")
testImplementation("org.objenesis:objenesis:3.3")
testImplementation("net.bytebuddy:byte-buddy:1.12.20")
}

compileJava {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

test {
    useJUnitPlatform()
}

repositories { mavenCentral() }

apply plugin : 'jacoco'

test {
  
  jvmArgs += ["-Xshare:off"]

  reports.html.outputLocation = file("$projectDir/testReport");

  testLogging {
    events "passed", "skipped", "failed"
    showStandardStreams = false
  }
    
  jacoco {
    enabled = true
    includeNoLocationClasses = false
    sessionId = "<auto-generated value>"
    dumpOnExit = true
    classDumpDir = null
    output = JacocoTaskExtension.Output.FILE
  }
}
jacocoTestReport {
  reports {
      xml.required = false
      csv.required = false
      html.outputLocation =  file("$projectDir/coverageReport")
  }
}
