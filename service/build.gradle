apply plugin: 'java-library'
apply plugin: "com.vanniktech.maven.publish"

dependencies {
    api project(":client")
    api libs.retrofit
    implementation libs.retrofitRxJava2
    implementation libs.retrofitJackson
    implementation libs.jacksonJsonSchema

    testImplementation(platform(libs.junitBom))
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation libs.retrofitMock

//dependency added by roostGPT
testImplementation("org.mockito:mockito-core:5.2.0")
testImplementation("org.mockito:mockito-junit-jupiter:5.2.0")
testImplementation("net.bytebuddy:byte-buddy:1.14.1")
testImplementation("org.objenesis:objenesis:3.2")

//dependency added by roostGPT
testImplementation("org.assertj:assertj-core:3.24.2")
testImplementation("org.hamcrest:hamcrest:2.2")
testImplementation("org.awaitility:awaitility:4.2.0")
testImplementation("org.slf4j:slf4j-api:1.7.36")
testImplementation("org.slf4j:slf4j-simple:1.7.36")
testImplementation("com.squareup.okhttp3:mockwebserver:4.10.0")
testImplementation("com.squareup.okhttp3:okhttp:4.10.0")
testImplementation("org.apiguardian:apiguardian-api:1.1.2")
testImplementation("org.opentest4j:opentest4j:1.2.0")
testImplementation("net.bytebuddy:byte-buddy-agent:1.14.1")
testImplementation("net.bytebuddy:byte-buddy:1.14.1")
}

compileJava {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

test {
    useJUnitPlatform()
}

repositories { mavenCentral() }

apply plugin : 'jacoco'

test {
  
  jvmArgs += ["-Xshare:off"]

  reports.html.outputLocation = file("$projectDir/testReport");

  testLogging {
    events "passed", "skipped", "failed"
    showStandardStreams = false
  }
    
  jacoco {
    enabled = true
    includeNoLocationClasses = false
    sessionId = "<auto-generated value>"
    dumpOnExit = true
    classDumpDir = null
    output = JacocoTaskExtension.Output.FILE
  }
}
jacocoTestReport {
  reports {
      xml.required = false
      csv.required = false
      html.outputLocation =  file("$projectDir/coverageReport")
  }
}
