apply plugin: 'java-library'
apply plugin: "com.vanniktech.maven.publish"

dependencies {
    api project(":client")
    api libs.retrofit
    implementation libs.retrofitRxJava2
    implementation libs.retrofitJackson
    implementation libs.jacksonJsonSchema

    testImplementation(platform(libs.junitBom))
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation libs.retrofitMock

//dependency added by roostGPT
testImplementation("org.mockito:mockito-core:4.0.0")
testImplementation("org.mockito:mockito-junit-jupiter:4.0.0")

//dependency added by roostGPT
testImplementation("org.assertj:assertj-core:3.21.0")
testImplementation("com.squareup.okhttp3:mockwebserver:4.9.1")
}

compileJava {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

test {
    useJUnitPlatform()
}

repositories { mavenCentral() }

apply plugin : 'jacoco'

test {
  
  jvmArgs += ["-Xshare:off"]

  reports.html.outputLocation = file("$projectDir/testReport");

  testLogging {
    events "passed", "skipped", "failed"
    showStandardStreams = false
  }
    
  jacoco {
    enabled = true
    includeNoLocationClasses = false
    sessionId = "<auto-generated value>"
    dumpOnExit = true
    classDumpDir = null
    output = JacocoTaskExtension.Output.FILE
  }
}
jacocoTestReport {
  reports {
      xml.required = false
      csv.required = false
      html.outputLocation =  file("$projectDir/coverageReport")
  }
}
