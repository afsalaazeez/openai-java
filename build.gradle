plugins {
    id "com.vanniktech.maven.publish" version "0.19.0" apply false
}

allprojects {
    plugins.withId("com.vanniktech.maven.publish") {
        mavenPublish {
            sonatypeHost = "S01"
        }
    }
}

// Top-level build file where you can add configuration options common to all sub-projects/modules.apply plugin : 'java'
repositories { mavenCentral() }

apply plugin : 'jacoco'

test {
  
  jvmArgs += ["-Xshare:off"]

  reports.html.outputLocation = file("$projectDir/testReport");

  testLogging {
    events "passed", "skipped", "failed"
    showStandardStreams = false
  }
    
  jacoco {
    enabled = true
    includeNoLocationClasses = false
    sessionId = "<auto-generated value>"
    dumpOnExit = true
    classDumpDir = null
    output = JacocoTaskExtension.Output.FILE
  }
}
jacocoTestReport {
  reports {
      xml.required = false
      csv.required = false
      html.outputLocation =  file("$projectDir/coverageReport")
  }
}


dependencies {
//dependency added by roostGPT
testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.2")
testImplementation("org.junit.jupiter:junit-jupiter-engine:5.10.2")
testImplementation("org.assertj:assertj-core:3.25.3")
testImplementation("org.mockito:mockito-core:5.2.0")
testImplementation("net.bytebuddy:byte-buddy:1.14.10")
testImplementation("org.objenesis:objenesis:3.3")
testImplementation("org.apiguardian:apiguardian-api:1.1.2")
}